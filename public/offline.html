<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin conexión | LensSpace</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8f7; color: #07322f; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #4b6563; line-height: 1.5; }
  button { border: 0; border-radius: 12px; padding: 12px 20px; min-height: 44px; background: #0d7a72; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>No hay señal para abrir LensSpace. Lo que ya guardaste no se perdió. Vuelve a intentarlo cuando regrese la conexión.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
